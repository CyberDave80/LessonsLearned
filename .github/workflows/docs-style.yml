name: Docs Style Enforcement

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout full history
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for HEAD~1

      # 2. Cache node_modules to speed up Prettier installs
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-prettier-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-prettier-

      # 3. Auto-insert missing Markdown sections
      - name: Ensure required sections
        run: |
          for file in $(find . -name "*.md"); do
            echo "Processing $file..."
            # Create a temp file
            tmpfile=$(mktemp)
            added=false
            # Insert ## Summary if missing
            grep -q "^## Summary" "$file" || { echo -e "## Summary\n\n" >> "$tmpfile"; added=true; }
            # Insert ## What I Learned if missing
            grep -q "^## What I Learned" "$file" || { echo -e "## What I Learned\n\n" >> "$tmpfile"; added=true; }
            # Insert ## Commands if missing
            grep -q "^## Commands" "$file" || { echo -e "## Commands\n\n" >> "$tmpfile"; added=true; }
            # Append original content
            cat "$file" >> "$tmpfile"
            # Replace original file if we added anything
            if [ "$added" = true ]; then
              mv "$tmpfile" "$file"
              echo "Added missing sections to $file"
            else
              rm "$tmpfile"
            fi
          done

      # 4. Run Prettier to auto-format Markdown
      - name: Prettier Action
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --write **/*.md
          only_changed: true
          clean_node_folder: false
          no_commit: true

      # 5. Commit formatting changes (if any)
      - name: Auto-commit Prettier fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-format Markdown docs"
          file_pattern: '**/*.md'
