name: Docs Auto-Format & Template Enforcement

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Use Node.js 24 for GitHub Actions

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout full repo history
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git diff

      # 2. Cache node_modules for Prettier
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-prettier-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-prettier-

      # 3. Get Markdown files changed in this commit/PR
      - name: Get changed Markdown files
        id: changed-files
        run: |
          files=$(git diff --name-only HEAD~1 HEAD | grep '\.md$' || true)
          echo "files=$files" >> $GITHUB_OUTPUT

      # 4. Skip workflow if no Markdown files changed
      - name: Skip if no Markdown changes
        if: steps.changed-files.outputs.files == ''
        run: echo "No Markdown files changed, skipping workflow."

      # 5. Ensure required sections exist, prepend if missing
      - name: Ensure required sections
        if: steps.changed-files.outputs.files != ''
        run: |
          for file in ${{ steps.changed-files.outputs.files }}; do
            echo "Processing $file..."
            tmpfile=$(mktemp)
            added=false
            # Prepend missing sections at the top
            grep -q "^## Summary" "$file" || { echo -e "## Summary\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## What I Learned" "$file" || { echo -e "## What I Learned\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## Commands" "$file" || { echo -e "## Commands\n\n" >> "$tmpfile"; added=true; }
            # Append original file content
            cat "$file" >> "$tmpfile"
            if [ "$added" = true ]; then
              mv "$tmpfile" "$file"
              echo "Added missing sections to $file"
            else
              rm "$tmpfile"
            fi
          done

      # 6. Prettify changed Markdown files
      - name: Prettier Action
        if: steps.changed-files.outputs.files != ''
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --write ${{ steps.changed-files.outputs.files }}
          clean_node_folder: false
          no_commit: true

      # 7. Commit changes if any
      - name: Commit Auto-Formatted Markdown
        if: steps.changed-files.outputs.files != ''
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-format and enforce Markdown template"
          file_pattern: ${{ steps.changed-files.outputs.files }}
