name: Docs Style Enforcement (Full Repo)

on:
  workflow_dispatch: # Run manually
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo (full history for git operations)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Prettier (pinned to major version 3 for deterministic behaviour)
      - name: Install Prettier
        run: npm install --global prettier@3

      # 3. Add missing required sections to all Markdown files (excluding .github/)
      - name: Ensure required sections in all Markdown files
        run: |
          find . -name "*.md" -not -path "./.github/*" -print0 \
            | xargs -0r bash scripts/enforce-doc-format.sh

      # 4. Run Prettier on all Markdown files (excluding .github/)
      - name: Run Prettier on all Markdown files
        run: |
          find . -name "*.md" -not -path "./.github/*" -print0 \
            | xargs -0r prettier --write

      # 5. Create or update a pull request with any formatting changes
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-format and add missing required sections"
          branch: auto-format/${{ github.run_id }}
          base: main
          title: "Docs: Auto-format and add missing required sections"
          body: |
            This PR was created automatically to:
            - Add missing required sections (`## Summary`, `## What I Learned`, `## Commands`) to Markdown documents
            - Apply Prettier formatting to all Markdown files

            Triggered by a push to `main` or a pull request.
