name: Docs Full Repo Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  update-all-docs:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout full repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Cache node_modules
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-prettier-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-prettier-

      # 3. Get all Markdown files
      - name: Find all Markdown files
        id: all-md
        run: |
          find . -name "*.md" > all_md.txt
          files=$(cat all_md.txt | tr '\n' ' ')
          echo "files=$files" >> $GITHUB_OUTPUT

      # 4. Ensure required sections
      - name: Ensure required sections
        run: |
          for file in ${{ steps.all-md.outputs.files }}; do
            echo "Processing $file..."
            tmpfile=$(mktemp)
            added=false
            # Only add sections if missing
            grep -q "^## Summary" "$file" || { echo -e "## Summary\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## What I Learned" "$file" || { echo -e "## What I Learned\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## Commands" "$file" || { echo -e "## Commands\n\n" >> "$tmpfile"; added=true; }
            # Keep existing content
            cat "$file" >> "$tmpfile"
            if [ "$added" = true ]; then
              mv "$tmpfile" "$file"
              echo "Added missing sections to $file"
            else
              rm "$tmpfile"
            fi
          done

      # 5. Prettify all Markdown files
      - name: Prettier Action
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --write "**/*.md"
          clean_node_folder: false
          no_commit: true

      # 6. Commit any changes
      - name: Commit Auto-Formatted Markdown
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Full repo update: add missing sections + format Markdown"
          file_pattern: ${{ steps.all-md.outputs.files }}
