name: Docs Style Enforcement (Full Repo)

on:
  workflow_dispatch:   # Run manually
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo (full history for git operations)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git history

      # 2. Cache npm modules to speed up Prettier installs
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-prettier
          restore-keys: |
            ${{ runner.os }}-prettier

      # 3. Add missing sections to all Markdown files
      - name: Ensure required sections
        run: |
          find . -name "*.md" > all_md.txt
          while IFS= read -r file; do
            echo "Processing '$file'..."
            tmpfile=$(mktemp)
            added=false
            grep -q "^## Summary" "$file" || { echo -e "## Summary\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## What I Learned" "$file" || { echo -e "## What I Learned\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## Commands" "$file" || { echo -e "## Commands\n\n" >> "$tmpfile"; added=true; }
            # Append existing content
            cat "$file" >> "$tmpfile"
            if [ "$added" = true ]; then
              mv "$tmpfile" "$file"
              echo "Added missing sections to '$file'"
            else
              rm "$tmpfile"
            fi
          done < all_md.txt

      # 4. Run Prettier on all Markdown files
      - name: Prettier Action
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --write '**/*.md'
          only_changed: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 5. Commit any changes made (sections added or formatting)
      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-format and add missing sections to Markdown docs"
          branch: main
          file_pattern: '**/*.md'
