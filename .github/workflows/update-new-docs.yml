name: Docs Style Enforcement (Incremental)

on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    paths:
      - '**/*.md'

permissions:
  contents: read

jobs:
  format-and-validate-incremental:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo with fetch-depth 2 for git diff operations
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Get list of changed Markdown files
      - name: Get changed Markdown files
        id: changed_files
        run: |
          echo "Checking changed markdown files..."
          # Get files changed between last two commits on push, or PR base and head
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
            FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD -- '*.md')
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- '*.md')
          fi
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 3. Exit early if no changed files
      - name: Check for changed files
        if: steps.changed_files.outputs.changed_files == ''
        run: |
          echo "No Markdown files changed. Skipping."
          exit 0

      # 4. Ensure required sections in changed files
      - name: Add missing required sections
        run: |
          for file in ${{ steps.changed_files.outputs.changed_files }}; do
            echo "Processing '$file'..."
            tmpfile=$(mktemp)
            added=false
            grep -q "^## Summary" "$file" || { echo -e "## Summary\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## What I Learned" "$file" || { echo -e "## What I Learned\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## Commands" "$file" || { echo -e "## Commands\n\n" >> "$tmpfile"; added=true; }
            cat "$file" >> "$tmpfile"
            if [ "$added" = true ]; then
              mv "$tmpfile" "$file"
              echo "Added missing sections to '$file'"
            else
              rm "$tmpfile"
            fi
          done

      # 5. Run Prettier only on changed files, passing explicit file names
      - name: Prettier on changed files
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Prettier
        run: npm install -g prettier@3.8.1
      - name: Prettify changed files
        run: |
          for file in ${{ steps.changed_files.outputs.changed_files }}; do
            echo "Prettifying $file"
            prettier --write "$file"
          done

      # 6. Configure git user for commit
      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 7. Commit changes if any
      - name: Commit changes
        run: |
          git add ${{ steps.changed_files.outputs.changed_files }}
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-format and add missing sections to changed Markdown files"
          git push origin HEAD:${{ github.ref_name }}
