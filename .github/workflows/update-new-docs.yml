name: Docs Style Enforcement (Incremental)

on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    paths:
      - '**/*.md'

permissions:
  contents: write

jobs:
  incremental-format:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Cache npm modules
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-prettier
          restore-keys: |
            ${{ runner.os }}-prettier

      # 3. Get changed Markdown files safely
      - name: Get changed Markdown files
        id: changed_files
        run: |
          git fetch origin main --depth=1
          # Null-separated to handle spaces/colons
          git diff --name-only -z origin/main...HEAD -- '*.md' > changed_md.txt
          cat changed_md.txt | tr '\0' '\n'
          echo "::set-output name=changed_files::$(cat changed_md.txt | tr '\0' '\n')"

      # 4. Add missing required sections safely
      - name: Add missing sections
        run: |
          while IFS= read -r -d '' file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then
              echo "Skipping missing file '$file'"
              continue
            fi
            echo "Processing '$file'..."
            tmpfile=$(mktemp)
            added=false
            grep -q "^## Summary" "$file" || { echo -e "## Summary\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## What I Learned" "$file" || { echo -e "## What I Learned\n\n" >> "$tmpfile"; added=true; }
            grep -q "^## Commands" "$file" || { echo -e "## Commands\n\n" >> "$tmpfile"; added=true; }
            cat "$file" >> "$tmpfile"
            if [ "$added" = true ]; then
              mv "$tmpfile" "$file"
              echo "Added missing sections to '$file'"
            else
              rm "$tmpfile"
            fi
          done < changed_md.txt

      # 5. Prettify changed files safely
      - name: Prettify changed files
        run: |
          while IFS= read -r -d '' file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then
              echo "Skipping missing file '$file'"
              continue
            fi
            echo "Prettifying '$file'"
            npx prettier --write "$file"
          done < changed_md.txt

      # 6. Commit changes if any
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Incremental: Add missing sections & Prettify Markdown"
          branch: auto-format/${{ github.run_id }}
          file_pattern: '**/*.md'
