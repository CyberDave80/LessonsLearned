name: Docs Style Enforcement (Incremental)

on:
  pull_request:
    paths:
      - "**/*.md"
      - "!.github/**"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "!.github/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  incremental-format:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo (full history needed for git diff)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Prettier (pinned to major version 3 for deterministic behaviour)
      - name: Install Prettier
        run: npm install --global prettier@3

      # 3. Detect changed Markdown files (null-delimited to handle spaces in names)
      - name: Get changed Markdown files
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Fall back gracefully if base SHA is unavailable (e.g. first push)
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only -z "$BASE" "$HEAD" -- '*.md' 2>/dev/null \
            | grep -z -v '^\.github/' \
            > changed_md.txt || true

          echo "Changed Markdown files:"
          tr '\0' '\n' < changed_md.txt

          {
            echo "files<<EOF"
            tr '\0' '\n' < changed_md.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 4. Add missing required sections to changed files only
      - name: Ensure required sections in changed files
        run: |
          if [ -s changed_md.txt ]; then
            xargs -0r bash scripts/enforce-doc-format.sh < changed_md.txt
          else
            echo "No changed Markdown files to process."
          fi

      # 5. Run Prettier on changed files
      - name: Run Prettier on changed files
        run: |
          if [ -s changed_md.txt ]; then
            xargs -0r prettier --write < changed_md.txt
          else
            echo "No changed Markdown files to prettify."
          fi

      # 6. Create or update a pull request with any formatting changes
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: incremental auto-format and add missing required sections"
          branch: auto-format/${{ github.run_id }}
          base: main
          title: "Docs: Auto-format changed Markdown files (run ${{ github.run_id }})"
          body: |
            This PR was created automatically to:
            - Add missing required sections (`## Summary`, `## What I Learned`, `## Commands`) to changed Markdown documents
            - Apply Prettier formatting to the changed Markdown files

            Triggered by `${{ github.event_name }}` on `${{ github.ref }}`.
